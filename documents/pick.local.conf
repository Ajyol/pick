server {
    listen 8080;
    server_name pick.local;
    root /Users/userselu/oldenglish/www/pick;  # Update with your actual path
    index index.html index.php;

    # Updated log paths for Homebrew
    #error_log /opt/homebrew/var/log/nginx/pick-project.error.log;
    #access_log /opt/homebrew/var/log/nginx/pick-project.access.log;

    # Handle static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Handle common static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Handle favicon.ico
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}